name: Beta Release (PyPI Pre-release)
concurrency:
  group: beta-release
  cancel-in-progress: true
on:
  workflow_dispatch: {}
jobs:
  update_unity_beta_version:
    name: Update Unity package to beta version
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      unity_beta_version: ${{ steps.version.outputs.unity_beta_version }}
      version_updated: ${{ steps.commit.outputs.updated }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: beta
    - name: Generate beta version for Unity package
      id: version
      shell: bash
      run: "set -euo pipefail\n# Read current Unity package version\nCURRENT_VERSION=$(jq\
        \ -r '.version' MCPForUnity/package.json)\necho \"Current Unity package version:\
        \ $CURRENT_VERSION\"\n\n# Check if already a beta version - increment beta\
        \ number\nif [[ \"$CURRENT_VERSION\" =~ ^([0-9]+\\.[0-9]+\\.[0-9]+)-beta\\\
        .([0-9]+)$ ]]; then\n  BASE_VERSION=\"${BASH_REMATCH[1]}\"\n  BETA_NUM=\"\
        ${BASH_REMATCH[2]}\"\n  NEXT_BETA=$((BETA_NUM + 1))\n  BETA_VERSION=\"${BASE_VERSION}-beta.${NEXT_BETA}\"\
        \n  echo \"Incrementing beta number: $CURRENT_VERSION -> $BETA_VERSION\"\n\
        elif [[ \"$CURRENT_VERSION\" =~ ^([0-9]+)\\.([0-9]+)\\.([0-9]+)$ ]]; then\n\
        \  # Stable version - bump patch and add -beta.1 suffix\n  # This ensures\
        \ beta is \"newer\" than stable (9.3.2-beta.1 > 9.3.1)\n  # The release workflow\
        \ decides final bump type (patch/minor/major)\n  MAJOR=\"${BASH_REMATCH[1]}\"\
        \n  MINOR=\"${BASH_REMATCH[2]}\"\n  PATCH=\"${BASH_REMATCH[3]}\"\n  NEXT_PATCH=$((PATCH\
        \ + 1))\n  BETA_VERSION=\"${MAJOR}.${MINOR}.${NEXT_PATCH}-beta.1\"\n  echo\
        \ \"Converting stable to beta: $CURRENT_VERSION -> $BETA_VERSION\"\nelse\n\
        \  echo \"Error: Could not parse version '$CURRENT_VERSION'\" >&2\n  exit\
        \ 1\nfi\n\n# Always output the computed version\necho \"unity_beta_version=$BETA_VERSION\"\
        \ >> \"$GITHUB_OUTPUT\"\n\n# Only skip update if computed version matches\
        \ current (no change needed)\nif [[ \"$BETA_VERSION\" == \"$CURRENT_VERSION\"\
        \ ]]; then\n  echo \"Version unchanged, skipping update\"\n  echo \"needs_update=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"Version will be updated: $CURRENT_VERSION\
        \ -> $BETA_VERSION\"\n  echo \"needs_update=true\" >> \"$GITHUB_OUTPUT\"\n\
        fi\n"
    - name: Update Unity package.json with beta version
      if: steps.version.outputs.needs_update == 'true'
      env:
        BETA_VERSION: ${{ steps.version.outputs.unity_beta_version }}
      shell: bash
      run: 'set -euo pipefail

        # Update package.json version

        jq --arg v "$BETA_VERSION" ''.version = $v'' MCPForUnity/package.json > tmp.json

        mv tmp.json MCPForUnity/package.json

        echo "Updated MCPForUnity/package.json:"

        jq ''.version'' MCPForUnity/package.json

        '
    - name: Commit to temporary branch and create PR
      id: commit
      if: steps.version.outputs.needs_update == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        BETA_VERSION: ${{ steps.version.outputs.unity_beta_version }}
      shell: bash
      run: "set -euo pipefail\ngit config user.name \"GitHub Actions\"\ngit config\
        \ user.email \"actions@github.com\"\n\nif git diff --quiet MCPForUnity/package.json;\
        \ then\n  echo \"No changes to commit\"\n  echo \"updated=false\" >> \"$GITHUB_OUTPUT\"\
        \n  exit 0\nfi\n\n# Create a temporary branch for the version update\nBRANCH=\"\
        beta-version-${BETA_VERSION}-${GITHUB_RUN_ID}\"\necho \"branch=$BRANCH\" >>\
        \ \"$GITHUB_OUTPUT\"\n\ngit checkout -b \"$BRANCH\"\ngit add MCPForUnity/package.json\n\
        git commit -m \"chore: update Unity package to beta version ${BETA_VERSION}\"\
        \ngit push origin \"$BRANCH\"\n\n# Check if PR already exists\nif gh pr view\
        \ \"$BRANCH\" >/dev/null 2>&1; then\n  echo \"PR already exists for $BRANCH\"\
        \nelse\n  PR_URL=$(gh pr create \\\n    --base beta \\\n    --head \"$BRANCH\"\
        \ \\\n    --title \"chore: update Unity package to beta version ${BETA_VERSION}\"\
        \ \\\n    --body \"Automated beta version bump for the Unity package.\")\n\
        \  echo \"pr_url=$PR_URL\" >> \"$GITHUB_OUTPUT\"\nfi\necho \"updated=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
  publish_pypi_prerelease:
    name: Publish beta to PyPI (pre-release)
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    environment:
      name: pypi
      url: https://pypi.org/p/mcpforunityserver
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: beta
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: latest
        enable-cache: true
        cache-dependency-glob: Server/uv.lock
    - name: Generate beta version
      id: version
      shell: bash
      run: "set -euo pipefail\nRAW_VERSION=$(grep -oP '(?<=version = \")[^\"]+' Server/pyproject.toml)\n\
        echo \"Raw version: $RAW_VERSION\"\n\n# Check if already a beta/prerelease\
        \ version\nif [[ \"$RAW_VERSION\" =~ (a|b|rc|\\.dev|\\.post)[0-9]+$ ]]; then\n\
        \  IS_PRERELEASE=true\n  # Strip the prerelease suffix to get base version\n\
        \  BASE_VERSION=$(echo \"$RAW_VERSION\" | sed -E 's/(a|b|rc|\\.dev|\\.post)[0-9]+$//')\n\
        else\n  IS_PRERELEASE=false\n  BASE_VERSION=\"$RAW_VERSION\"\nfi\n\n# Validate\
        \ we have a proper X.Y.Z format\nif ! [[ \"$BASE_VERSION\" =~ ^[0-9]+\\.[0-9]+\\\
        .[0-9]+$ ]]; then\n  echo \"Error: Could not parse version '$RAW_VERSION'\
        \ -> '$BASE_VERSION'\" >&2\n  exit 1\nfi\n\nIFS='.' read -r MAJOR MINOR PATCH\
        \ <<< \"$BASE_VERSION\"\n\n# Only bump patch if coming from stable; keep same\
        \ base if already prerelease\nif [[ \"$IS_PRERELEASE\" == \"true\" ]]; then\n\
        \  # Already on a beta series - keep the same base version\n  NEXT_PATCH=\"\
        $PATCH\"\n  echo \"Already prerelease, keeping base: $BASE_VERSION\"\nelse\n\
        \  # Stable version - bump patch to ensure beta is \"newer\"\n  NEXT_PATCH=$((PATCH\
        \ + 1))\n  echo \"Stable version, bumping patch: $PATCH -> $NEXT_PATCH\"\n\
        fi\n\nBETA_NUMBER=\"$(date +%Y%m%d%H%M%S)\"\nBETA_VERSION=\"${MAJOR}.${MINOR}.${NEXT_PATCH}b${BETA_NUMBER}\"\
        \necho \"Base version: $BASE_VERSION\"\necho \"Beta version: $BETA_VERSION\"\
        \necho \"beta_version=$BETA_VERSION\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Update version for beta release
      env:
        BETA_VERSION: ${{ steps.version.outputs.beta_version }}
      shell: bash
      run: 'set -euo pipefail

        sed -i "s/^version = .*/version = \"${BETA_VERSION}\"/" Server/pyproject.toml

        echo "Updated pyproject.toml:"

        grep "^version" Server/pyproject.toml

        '
    - name: Build a binary wheel and a source tarball
      shell: bash
      run: uv build
      working-directory: ./Server
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: Server/dist/

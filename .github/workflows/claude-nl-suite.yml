      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport xml.etree.ElementTree\
        \ as ET\nimport re\nimport shutil\n\nDESIRED = [\"NL-0\",\"NL-1\",\"NL-2\"\
        ,\"NL-3\",\"NL-4\",\"T-A\",\"T-B\",\"T-C\",\"T-D\",\"T-E\",\"T-F\",\"T-G\"\
        ,\"T-H\",\"T-I\",\"T-J\",\"GO-0\",\"GO-1\",\"GO-2\",\"GO-3\",\"GO-4\",\"GO-5\"\
        ,\"GO-6\",\"GO-7\",\"GO-8\",\"GO-9\",\"GO-10\"]\nseen = set()\nbad = set()\n\
        def id_from_filename(p: Path):\n  n = p.name\n  m = re.match(r'NL-?(\\d+)_results\\\
        .xml$', n, re.I)\n  if m:\n    return f\"NL-{int(m.group(1))}\"\n  m = re.match(r'T-?([A-J])_results\\\
        .xml$', n, re.I)\n  if m:\n    return f\"T-{m.group(1).upper()}\"\n  m = re.match(r'GO-?(\\\
        d+)_results\\.xml$', n, re.I)\n  if m:\n    return f\"GO-{int(m.group(1))}\"\
        \n  return None\n\nfor p in Path(\"reports\").glob(\"*_results.xml\"):\n \
        \ fid = id_from_filename(p)\n  try:\n    r = ET.parse(p).getroot()\n  except\
        \ Exception:\n    # If the file exists but isn't parseable, preserve it for\
        \ debugging and\n    # treat it as a failing (malformed) fragment rather than\
        \ \"not produced\".\n    if fid in DESIRED and p.exists() and p.stat().st_size\
        \ > 0:\n      staging = Path(\"reports/_staging\")\n      staging.mkdir(parents=True,\
        \ exist_ok=True)\n      preserved = staging / f\"{fid}_malformed.xml\"\n \
        \     try:\n        shutil.copyfile(p, preserved)\n      except Exception:\n\
        \        pass\n      bad.add(fid)\n    continue\n  # Count by filename id\
        \ primarily; fall back to testcase name if needed\n  if fid in DESIRED:\n\
        \    seen.add(fid)\n    continue\n  if r.tag == \"testcase\":\n    name =\
        \ (r.get(\"name\") or \"\").strip()\n    for d in DESIRED:\n      if name.startswith(d):\n\
        \        seen.add(d)\n        break\n\nPath(\"reports\").mkdir(parents=True,\
        \ exist_ok=True)\nfor d in DESIRED:\n  if d in seen:\n    continue\n  frag\
        \ = Path(f\"reports/{d}_results.xml\")\n  tc = ET.Element(\"testcase\", {\"\
        classname\":\"UnityMCP.NL-T\", \"name\": d})\n  if d in bad:\n    fail = ET.SubElement(tc,\
        \ \"failure\", {\"message\":\"malformed xml\"})\n    fail.text = \"The agent\
        \ wrote a fragment file, but it was not valid XML (parse failed). See reports/_staging/*_malformed.xml\
        \ for the preserved original.\"\n  else:\n    fail = ET.SubElement(tc, \"\
        failure\", {\"message\":\"not produced\"})\n    fail.text = \"The agent did\
        \ not emit a fragment for this test.\"\n  ET.ElementTree(tc).write(frag, encoding=\"\
        utf-8\", xml_declaration=False)\n  print(f\"backfill: {d}\")\nPY\n"
    - name: 'Debug: list testcase names'
      if: always()
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport xml.etree.ElementTree\
        \ as ET\nfor p in sorted(Path('reports').glob('*_results.xml')):\n    try:\n\
        \        r = ET.parse(p).getroot()\n        if r.tag == 'testcase':\n    \
        \        print(f\"{p.name}: {(r.get('name') or '').strip()}\")\n    except\
        \ Exception:\n        pass\nPY\n"
    - name: Normalize/assemble JUnit in-place (single file)
      if: always()
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport xml.etree.ElementTree\
        \ as ET\nimport re, os\n\ndef localname(tag: str) -> str:\n    return tag.rsplit('}',\
        \ 1)[-1] if '}' in tag else tag\n\nsrc = Path(os.environ.get('JUNIT_OUT',\
        \ 'reports/junit-nl-suite.xml'))\nif not src.exists():\n    raise SystemExit(0)\n\
        \ntree = ET.parse(src)\nroot = tree.getroot()\nsuite = root.find('./*') if\
        \ localname(root.tag) == 'testsuites' else root\nif suite is None:\n    raise\
        \ SystemExit(0)\n\ndef id_from_filename(p: Path):\n    n = p.name\n    m =\
        \ re.match(r'NL-?(\\d+)_results\\.xml$', n, re.I)\n    if m:\n        return\
        \ f\"NL-{int(m.group(1))}\"\n    m = re.match(r'T-?([A-J])_results\\.xml$',\
        \ n, re.I)\n    if m:\n        return f\"T-{m.group(1).upper()}\"\n    m =\
        \ re.match(r'GO-?(\\d+)_results\\.xml$', n, re.I)\n    if m:\n        return\
        \ f\"GO-{int(m.group(1))}\"\n    return None\n\ndef id_from_system_out(tc):\n\
        \    so = tc.find('system-out')\n    if so is not None and so.text:\n    \
        \    m = re.search(r'\\b(NL-\\d+|T-[A-Z]|GO-\\d+)\\b', so.text)\n        if\
        \ m:\n            return m.group(1)\n    return None\n\nfragments = sorted(Path('reports').glob('*_results.xml'))\n\
        report_names = {p.name for p in fragments}\nfragments += sorted(p for p in\
        \ Path('reports/_staging').glob('*_results.xml') if p.name not in report_names)\n\
        if fragments:\n    print(\"merge fragments:\", \", \".join(p.as_posix() for\
        \ p in fragments))\nadded = 0\nrenamed = 0\n\nfor frag in fragments:\n   \
        \ tcs = []\n    try:\n        froot = ET.parse(frag).getroot()\n        if\
        \ localname(froot.tag) == 'testcase':\n            tcs = [froot]\n       \
        \ else:\n            tcs = list(froot.findall('.//testcase'))\n    except\
        \ Exception:\n        txt = Path(frag).read_text(encoding='utf-8', errors='replace')\n\
        \        # Extract all testcase nodes from raw text\n        nodes = re.findall(r'<testcase[\\\
        s\\S]*?</testcase>', txt, flags=re.DOTALL)\n        for m in nodes:\n    \
        \        try:\n                tcs.append(ET.fromstring(m))\n            except\
        \ Exception:\n                pass\n\n    # Guard: keep only the first testcase\
        \ from each fragment\n    if len(tcs) > 1:\n        tcs = tcs[:1]\n\n    test_id\
        \ = id_from_filename(frag)\n\n    for tc in tcs:\n        current_name = tc.get('name')\
        \ or ''\n        tid = test_id or id_from_system_out(tc)\n        # Enforce\
        \ filename-derived ID as prefix; repair names if needed\n        if tid and\
        \ not re.match(r'^\\s*(NL-\\d+|T-[A-Z]|GO-\\d+)\\b', current_name):\n    \
        \        title = current_name.strip()\n            new_name = f'{tid} \u2014\
        \ {title}' if title else tid\n            tc.set('name', new_name)\n     \
        \   elif tid and not re.match(rf'^\\s*{re.escape(tid)}\\b', current_name):\n\
        \            # Replace any wrong leading ID with the correct one\n       \
        \     title = re.sub(r'^\\s*(NL-\\d+|T-[A-Z]|GO-\\d+)\\s*[\u2014\u2013:\\\
        -]\\s*', '', current_name).strip()\n            new_name = f'{tid} \u2014\
        \ {title}' if title else tid\n            tc.set('name', new_name)\n     \
        \       renamed += 1\n        suite.append(tc)\n        added += 1\n     \
        \   print(f\"merge add: {frag.name} -> {tc.get('name')}\")\n\nif added:\n\
        \    # Drop bootstrap placeholder and recompute counts\n    for tc in list(suite.findall('.//testcase')):\n\
        \        if (tc.get('name') or '') == 'NL-Suite.Bootstrap':\n            suite.remove(tc)\n\
        \    testcases = suite.findall('.//testcase')\n    failures_cnt = sum(1 for\
        \ tc in testcases if (tc.find('failure') is not None or tc.find('error') is\
        \ not None))\n    suite.set('tests', str(len(testcases)))\n    suite.set('failures',\
        \ str(failures_cnt))\n    suite.set('errors', '0')\n    suite.set('skipped',\
        \ '0')\n    tree.write(src, encoding='utf-8', xml_declaration=True)\n    print(f\"\
        Appended {added} testcase(s); renamed {renamed} to canonical NL/T names.\"\
        )\nPY\n"
    - name: 'Guard: ensure GO fragments merged into JUnit'
      if: always()
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport xml.etree.ElementTree\
        \ as ET\nimport os, re\n\ndef localname(tag: str) -> str:\n    return tag.rsplit('}',\
        \ 1)[-1] if '}' in tag else tag\n\njunit_path = Path(os.environ.get('JUNIT_OUT',\
        \ 'reports/junit-nl-suite.xml'))\nif not junit_path.exists():\n    raise SystemExit(0)\n\
        \ntree = ET.parse(junit_path)\nroot = tree.getroot()\nsuite = root.find('./*')\
        \ if localname(root.tag) == 'testsuites' else root\nif suite is None:\n  \
        \  raise SystemExit(0)\n\ndef id_from_filename(p: Path):\n    n = p.name\n\
        \    m = re.match(r'GO-?(\\d+)_results\\.xml$', n, re.I)\n    if m:\n    \
        \    return f\"GO-{int(m.group(1))}\"\n    return None\n\nexpected = set()\n\
        for p in list(Path(\"reports\").glob(\"GO-*_results.xml\")) + list(Path(\"\
        reports/_staging\").glob(\"GO-*_results.xml\")):\n    fid = id_from_filename(p)\n\
        \    if fid:\n        expected.add(fid)\n\nseen = set()\nfor tc in suite.findall('.//testcase'):\n\
        \    name = (tc.get('name') or '').strip()\n    m = re.match(r'(GO-\\d+)\\\
        b', name)\n    if m:\n        seen.add(m.group(1))\n\nmissing = sorted(expected\
        \ - seen)\nif missing:\n    print(f\"::error::GO fragments present but not\
        \ merged into JUnit: {' '.join(missing)}\")\n    raise SystemExit(1)\nPY\n"
    - name: Build markdown summary from JUnit
      if: always()
      shell: bash
      run: "python3 - <<'PY'\nimport xml.etree.ElementTree as ET\nfrom pathlib import\
        \ Path\nimport os, html, re\n\ndef localname(tag: str) -> str:\n    return\
        \ tag.rsplit('}', 1)[-1] if '}' in tag else tag\n\nsrc = Path(os.environ.get('JUNIT_OUT',\
        \ 'reports/junit-nl-suite.xml'))\nmd_out = Path(os.environ.get('MD_OUT', 'reports/junit-nl-suite.md'))\n\
        md_out.parent.mkdir(parents=True, exist_ok=True)\n\nif not src.exists():\n\
        \    md_out.write_text(\"# Unity NL/T Editing Suite Test Results\\n\\n(No\
        \ JUnit found)\\n\", encoding='utf-8')\n    raise SystemExit(0)\n\ntree =\
        \ ET.parse(src)\nroot = tree.getroot()\nsuite = root.find('./*') if localname(root.tag)\
        \ == 'testsuites' else root\ncases = [] if suite is None else list(suite.findall('.//testcase'))\n\
        \ndef id_from_case(tc):\n    n = (tc.get('name') or '')\n    m = re.match(r'\\\
        s*(NL-\\d+|T-[A-Z]|GO-\\d+)\\b', n)\n    if m:\n        return m.group(1)\n\
        \    so = tc.find('system-out')\n    if so is not None and so.text:\n    \
        \    m = re.search(r'\\b(NL-\\d+|T-[A-Z]|GO-\\d+)\\b', so.text)\n        if\
        \ m:\n            return m.group(1)\n    return None\n\nid_status = {}\nname_map\
        \ = {}\nfor tc in cases:\n    tid = id_from_case(tc)\n    ok = (tc.find('failure')\
        \ is None and tc.find('error') is None)\n    if tid and tid not in id_status:\n\
        \        id_status[tid] = ok\n        name_map[tid] = (tc.get('name') or tid)\n\
        \ndesired = ['NL-0','NL-1','NL-2','NL-3','NL-4','T-A','T-B','T-C','T-D','T-E','T-F','T-G','T-H','T-I','T-J','GO-0','GO-1','GO-2','GO-3','GO-4','GO-5','GO-6','GO-7','GO-8','GO-9','GO-10']\n\
        default_titles = {\n    'NL-0': 'Baseline State Capture',\n    'NL-1': 'Core\
        \ Method Operations',\n    'NL-2': 'Anchor Comment Insertion',\n    'NL-3':\
        \ 'End-of-Class Content',\n    'NL-4': 'Console State Verification',\n   \
        \ 'T-A': 'Temporary Helper',\n    'T-B': 'Method Body Interior',\n    'T-C':\
        \ 'Different Method Interior',\n    'T-D': 'End-of-Class Helper',\n    'T-E':\
        \ 'Method Evolution',\n    'T-F': 'Atomic Multi-Edit',\n    'T-G': 'Path Normalization',\n\
        \    'T-H': 'Validation on Modified',\n    'T-I': 'Failure Surface',\n   \
        \ 'T-J': 'Idempotency',\n    'GO-0': 'Hierarchy with ComponentTypes',\n  \
        \  'GO-1': 'Find GameObjects Tool',\n    'GO-2': 'GameObject Resource Read',\n\
        \    'GO-3': 'Components Resource Read',\n    'GO-4': 'Manage Components Tool',\n\
        \    'GO-5': 'Find GameObjects by Name',\n    'GO-6': 'Find GameObjects by\
        \ Tag',\n    'GO-7': 'Single Component Resource Read',\n    'GO-8': 'Remove\
        \ Component',\n    'GO-9': 'Find with Pagination',\n    'GO-10': 'Deprecation\
        \ Warnings',\n}\n\ndef display_name(test_id: str) -> str:\n    # Prefer the\
        \ emitted testcase \"name\" attribute (it may already include ID + title).\n\
        \    n = (name_map.get(test_id) or '').strip()\n    if n:\n        return\
        \ n\n    t = (default_titles.get(test_id) or '').strip()\n    return f\"{test_id}\
        \ \u2014 {t}\" if t else test_id\n\ntotal = len(cases)\nfailures = sum(1 for\
        \ tc in cases if (tc.find('failure') is not None or tc.find('error') is not\
        \ None))\npassed = total - failures\n\nlines = []\nlines += [\n    '# Unity\
        \ NL/T Editing Suite Test Results',\n    '',\n    f'Totals: {passed} passed,\
        \ {failures} failed, {total} total',\n    '',\n    '## Test Checklist'\n]\n\
        for p in desired:\n    st = id_status.get(p, None)\n    label = display_name(p)\n\
        \    lines.append(f\"- [x] {label}\" if st is True else (f\"- [ ] {label}\
        \ (fail)\" if st is False else f\"- [ ] {label} (not run)\"))\nlines.append('')\n\
        \nlines.append('## Test Details')\n\ndef order_key(n: str):\n    if n.startswith('NL-'):\n\
        \        try:\n            return (0, int(n.split('-')[1]))\n        except:\n\
        \            return (0, 999)\n    if n.startswith('T-') and len(n) > 2:\n\
        \        return (1, ord(n[2]))\n    if n.startswith('GO-'):\n        try:\n\
        \            return (2, int(n.split('-')[1]))\n        except:\n         \
        \   return (2, 999)\n    return (3, n)\n\nMAX_CHARS = 2000\nseen = set()\n\
        for tid in sorted(id_status.keys(), key=order_key):\n    seen.add(tid)\n \
        \   tc = next((c for c in cases if (id_from_case(c) == tid)), None)\n    if\
        \ not tc:\n        continue\n    title = name_map.get(tid, tid)\n    status_badge\
        \ = \"PASS\" if id_status[tid] else \"FAIL\"\n    lines.append(f\"### {title}\
        \ \u2014 {status_badge}\")\n    so = tc.find('system-out')\n    text = ''\
        \ if so is None or so.text is None else html.unescape(so.text.replace('\\\
        r\\n','\\n'))\n    if text.strip():\n        t = text.strip()\n        if\
        \ len(t) > MAX_CHARS:\n            t = t[:MAX_CHARS] + \"\\n\u2026(truncated)\"\
        \n        fence = '```' if '```' not in t else '````'\n        lines += [fence,\
        \ t, fence]\n    else:\n        lines.append('(no system-out)')\n    node\
        \ = tc.find('failure') or tc.find('error')\n    if node is not None:\n   \
        \     msg = (node.get('message') or '').strip()\n        body = (node.text\
        \ or '').strip()\n        if msg:\n            lines.append(f\"- Message:\
        \ {msg}\")\n        if body:\n            lines.append(f\"- Detail: {body.splitlines()[0][:500]}\"\
        )\n    lines.append('')\n\nfor tc in cases:\n    if id_from_case(tc) in seen:\n\
        \        continue\n    title = tc.get('name') or '(unnamed)'\n    status_badge\
        \ = \"PASS\" if (tc.find('failure') is None and tc.find('error') is None)\
        \ else \"FAIL\"\n    lines.append(f\"### {title} \u2014 {status_badge}\")\n\
        \    lines.append('(unmapped test id)')\n    lines.append('')\n\nmd_out.write_text('\\\
        n'.join(lines), encoding='utf-8')\nPY\n"
    - name: Fail CI if NL/T incomplete or failed
      if: always()
      shell: bash
      run: "python3 - <<'PY'\nimport os, re, sys\nfrom pathlib import Path\nimport\
        \ xml.etree.ElementTree as ET\n\ndesired = ['NL-0','NL-1','NL-2','NL-3','NL-4','T-A','T-B','T-C','T-D','T-E','T-F','T-G','T-H','T-I','T-J','GO-0','GO-1','GO-2','GO-3','GO-4','GO-5','GO-6','GO-7','GO-8','GO-9','GO-10']\n\
        \njunit_path = Path(os.environ.get('JUNIT_OUT', 'reports/junit-nl-suite.xml'))\n\
        if not junit_path.exists():\n    print(\"::error::No JUnit output found; failing\
        \ CI gate.\")\n    sys.exit(1)\n\ndef localname(tag: str) -> str:\n    return\
        \ tag.rsplit('}', 1)[-1] if '}' in tag else tag\n\ntree = ET.parse(junit_path)\n\
        root = tree.getroot()\nsuite = root.find('./*') if localname(root.tag) ==\
        \ 'testsuites' else root\ncases = [] if suite is None else list(suite.findall('.//testcase'))\n\
        \ndef id_from_case(tc):\n    name = (tc.get('name') or '').strip()\n    m\
        \ = re.match(r'(NL-\\d+|T-[A-Z]|GO-\\d+)\\b', name)\n    if m:\n        return\
        \ m.group(1)\n    so = tc.find('system-out')\n    if so is not None and so.text:\n\
        \        m = re.search(r'\\b(NL-\\d+|T-[A-Z]|GO-\\d+)\\b', so.text)\n    \
        \    if m:\n            return m.group(1)\n    return None\n\n# Determine\
        \ status per desired ID (first occurrence wins, matching the summary builder)\n\
        id_status = {}\nfor tc in cases:\n    tid = id_from_case(tc)\n    if not tid\
        \ or tid not in desired or tid in id_status:\n        continue\n    ok = (tc.find('failure')\
        \ is None and tc.find('error') is None)\n    id_status[tid] = ok\n\nmissing\
        \ = [d for d in desired if d not in id_status]\nfailed = [d for d, ok in id_status.items()\
        \ if ok is False]\n\nif missing:\n    print(f\"::error::Missing NL/T tests\
        \ in JUnit: {' '.join(missing)}\")\nif failed:\n    print(f\"::error::Failing\
        \ NL/T tests in JUnit: {' '.join(sorted(failed))}\")\n\n# Gate: all desired\
        \ must be present and passing\nif missing or failed:\n    sys.exit(1)\n\n\
        print(\"NL/T CI gate passed: all required tests present and passing.\")\n\
        PY\n"
    - name: Collect action execution transcript
      if: always()
      shell: bash
      run: "set -eux\nif [ -f \"$RUNNER_TEMP/claude-execution-output.json\" ]; then\n\
        \  cp \"$RUNNER_TEMP/claude-execution-output.json\" reports/claude-execution-output.json\n\
        elif [ -f \"/home/runner/work/_temp/claude-execution-output.json\" ]; then\n\
        \  cp \"/home/runner/work/_temp/claude-execution-output.json\" reports/claude-execution-output.json\n\
        fi\n"
    - name: Sanitize markdown (normalize newlines)
      if: always()
      run: "set -eu\npython3 - <<'PY'\nfrom pathlib import Path\nrp=Path('reports');\
        \ rp.mkdir(parents=True, exist_ok=True)\nfor p in rp.glob('*.md'):\n    b=p.read_bytes().replace(b'\\\
        x00', b'')\n    s=b.decode('utf-8','replace').replace('\\r\\n','\\n')\n  \
        \  p.write_text(s, encoding='utf-8', newline='\\n')\nPY\n"
    - name: NL/T details -> Job Summary
      if: always()
      run: "echo \"## Unity NL/T Editing Suite \u2014 Summary\" >> $GITHUB_STEP_SUMMARY\n\
        python3 - <<'PY' >> $GITHUB_STEP_SUMMARY\nfrom pathlib import Path\np = Path('reports/junit-nl-suite.md')\n\
        if p.exists():\n    text = p.read_bytes().decode('utf-8', 'replace')\n   \
        \ MAX = 65000\n    print(text[:MAX])\n    if len(text) > MAX:\n        print(\"\
        \\n\\n_\u2026truncated; full report in artifacts._\")\nelse:\n    print(\"\
        _No markdown report found._\")\nPY\n"
    - name: Fallback JUnit if missing
      if: always()
      run: "set -eu\nmkdir -p reports\nif [ ! -f \"$JUNIT_OUT\" ]; then\n  printf\
        \ '%s\\n' \\\n    '<?xml version=\"1.0\" encoding=\"UTF-8\"?>' \\\n    '<testsuite\
        \ name=\"UnityMCP.NL-T\" tests=\"1\" failures=\"1\" time=\"0\">' \\\n    '\
        \  <testcase classname=\"UnityMCP.NL-T\" name=\"NL-Suite.Execution\" time=\"\
        0.0\">' \\\n    '    <failure><![CDATA[No JUnit was produced by the NL suite\
        \ step. See the step logs.]]></failure>' \\\n    '  </testcase>' \\\n    '</testsuite>'\
        \ \\\n    > \"$JUNIT_OUT\"\nfi\n"
    - name: Publish JUnit report
      if: always()
      uses: mikepenz/action-junit-report@v5
      with:
        report_paths: ${{ env.JUNIT_OUT }}
        include_passed: true
        detailed_summary: true
        annotate_notice: true
        require_tests: false
        fail_on_parse_error: true
    - name: Upload artifacts (reports + fragments + transcript + debug)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: claude-nl-suite-artifacts
        path: '${{ env.JUNIT_OUT }}

          ${{ env.MD_OUT }}

          reports/*_results.xml

          reports/claude-execution-output.json

          ${{ github.workspace }}/.unity-mcp/mcp-server-startup-debug.log

          '
        retention-days: 7
    - name: Stop Unity
      if: always()
      run: 'docker logs --tail 400 unity-mcp | sed -E ''s/((email|serial|license|password|token)[^[:space:]]*)/[REDACTED]/ig''
        || true

        docker rm -f unity-mcp || true

        '
    - name: Return Pro license (if used)
      if: always() && steps.lic.outputs.use_ebl == 'true' && steps.lic.outputs.has_serial
        == 'true'
      uses: game-ci/unity-return-license@v2
      continue-on-error: true
      env:
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

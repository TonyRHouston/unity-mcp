    - name: Canonicalize testcase names (NL/T prefixes)
      if: always()
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport xml.etree.ElementTree\
        \ as ET, re, os\n\nRULES = [\n  (\"NL-0\", r\"\\b(NL-0|Baseline|State\\s*Capture)\\\
        b\"),\n  (\"NL-1\", r\"\\b(NL-1|Core\\s*Method)\\b\"),\n  (\"NL-2\", r\"\\\
        b(NL-2|Anchor|Build\\s*marker)\\b\"),\n  (\"NL-3\", r\"\\b(NL-3|End[-\\s]*of[-\\\
        s]*Class\\s*Content|Tail\\s*test\\s*[ABC])\\b\"),\n  (\"NL-4\", r\"\\b(NL-4|Console|Unity\\\
        s*console)\\b\"),\n  (\"T-A\",  r\"\\b(T-?A|Temporary\\s*Helper)\\b\"),\n\
        \  (\"T-B\",  r\"\\b(T-?B|Method\\s*Body\\s*Interior)\\b\"),\n  (\"T-C\",\
        \  r\"\\b(T-?C|Different\\s*Method\\s*Interior|ApplyBlend)\\b\"),\n  (\"T-D\"\
        ,  r\"\\b(T-?D|End[-\\s]*of[-\\s]*Class\\s*Helper|TestHelper)\\b\"),\n  (\"\
        T-E\",  r\"\\b(T-?E|Method\\s*Evolution|Counter|IncrementCounter)\\b\"),\n\
        \  (\"T-F\",  r\"\\b(T-?F|Atomic\\s*Multi[-\\s]*Edit)\\b\"),\n  (\"T-G\",\
        \  r\"\\b(T-?G|Path\\s*Normalization)\\b\"),\n  (\"T-H\",  r\"\\b(T-?H|Validation\\\
        s*on\\s*Modified)\\b\"),\n  (\"T-I\",  r\"\\b(T-?I|Failure\\s*Surface)\\b\"\
        ),\n  (\"T-J\",  r\"\\b(T-?J|Idempotenc(y|e))\\b\"),\n  (\"GO-0\", r\"\\b(GO-?0|Hierarchy.*ComponentTypes)\\\
        b\"),\n  (\"GO-1\", r\"\\b(GO-?1|Find\\s*GameObjects\\s*Tool)\\b\"),\n  (\"\
        GO-2\", r\"\\b(GO-?2|GameObject\\s*Resource)\\b\"),\n  (\"GO-3\", r\"\\b(GO-?3|Components\\\
        s*Resource)\\b\"),\n  (\"GO-4\", r\"\\b(GO-?4|Manage\\s*Components)\\b\"),\n\
        \  (\"GO-5\", r\"\\b(GO-?5|Find.*by.*Name)\\b\"),\n  (\"GO-6\", r\"\\b(GO-?6|Find.*by.*Tag)\\\
        b\"),\n  (\"GO-7\", r\"\\b(GO-?7|Single\\s*Component)\\b\"),\n  (\"GO-8\"\
        , r\"\\b(GO-?8|Remove\\s*Component)\\b\"),\n  (\"GO-9\", r\"\\b(GO-?9|Pagination)\\\
        b\"),\n  (\"GO-10\", r\"\\b(GO-?10|Deprecation)\\b\"),\n]\n\ndef canon_name(name:\
        \ str) -> str:\n  n = name or \"\"\n  for tid, pat in RULES:\n    if re.search(pat,\
        \ n, flags=re.I):\n      # If it already starts with the correct format, leave\
        \ it alone\n      if re.match(rf'^\\s*{re.escape(tid)}\\s*[\u2014\u2013-]',\
        \ n, flags=re.I):\n        return n.strip()\n      # If it has a different\
        \ separator, extract title and reformat\n      title_match = re.search(rf'{re.escape(tid)}\\\
        s*[:.\\-\u2013\u2014]\\s*(.+)', n, flags=re.I)\n      if title_match:\n  \
        \      title = title_match.group(1).strip()\n        return f\"{tid} \u2014\
        \ {title}\"\n      # Otherwise, just return the canonical ID\n      return\
        \ tid\n  return n\n\ndef id_from_filename(p: Path):\n  n = p.name\n  m = re.match(r'NL-?(\\\
        d+)_results\\.xml$', n, re.I)\n  if m:\n    return f\"NL-{int(m.group(1))}\"\
        \n  m = re.match(r'T-?([A-J])_results\\.xml$', n, re.I)\n  if m:\n    return\
        \ f\"T-{m.group(1).upper()}\"\n  m = re.match(r'GO-?(\\d+)_results\\.xml$',\
        \ n, re.I)\n  if m:\n    return f\"GO-{int(m.group(1))}\"\n  return None\n\
        \nfrags = list(sorted(Path(\"reports\").glob(\"*_results.xml\")))\nfor frag\
        \ in frags:\n  try:\n    tree = ET.parse(frag); root = tree.getroot()\n  except\
        \ Exception:\n    continue\n  if root.tag != \"testcase\":\n    continue\n\
        \  file_id = id_from_filename(frag)\n  old = root.get(\"name\") or \"\"\n\
        \  # Prefer filename-derived ID; if name doesn't start with it, override\n\
        \  if file_id:\n    # Respect file's ID (prevents T-D being renamed to NL-3\
        \ by loose patterns)\n    title = re.sub(r'^\\s*(NL-\\d+|T-[A-Z]|GO-\\d+)\\\
        s*[\u2014\u2013:\\-]\\s*', '', old).strip()\n    new = f\"{file_id} \u2014\
        \ {title}\" if title else file_id\n  else:\n    new = canon_name(old)\n  if\
        \ new != old and new:\n    root.set(\"name\", new)\n    tree.write(frag, encoding=\"\
        utf-8\", xml_declaration=False)\n    print(f'canon: {frag.name}: \"{old}\"\
        \ -> \"{new}\"')\n\n# Note: Do not auto-relable fragments. We rely on per-test\
        \ strict emission\n# and the backfill step to surface missing tests explicitly.\n\
        PY\n"
    - name: Backfill missing NL/T tests (fail placeholders)

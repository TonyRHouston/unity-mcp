name: Claude NL/T Full Suite (Unity live)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  checks: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UNITY_IMAGE: unityci/editor:ubuntu-2021.3.45f2-linux-il2cpp-3
jobs:
  nl-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JUNIT_OUT: reports/junit-nl-suite.xml
      MD_OUT: reports/junit-nl-suite.md
    steps:
    - name: Detect secrets (outputs)
      id: detect
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: "set -e\nif [ -n \"$ANTHROPIC_API_KEY\" ]; then echo \"anthropic_ok=true\"\
        \ >> \"$GITHUB_OUTPUT\"; else echo \"anthropic_ok=false\" >> \"$GITHUB_OUTPUT\"\
        ; fi\nif [ -n \"$UNITY_LICENSE\" ] || { [ -n \"$UNITY_EMAIL\" ] && [ -n \"\
        $UNITY_PASSWORD\" ] && [ -n \"$UNITY_SERIAL\" ]; }; then\n  echo \"unity_ok=true\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"unity_ok=false\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v4
      with:
        python-version: '3.11'
    - name: Install MCP server
      run: "set -eux\nuv venv\necho \"VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv\" >> \"\
        $GITHUB_ENV\"\necho \"$GITHUB_WORKSPACE/.venv/bin\" >> \"$GITHUB_PATH\"\n\
        if [ -f Server/pyproject.toml ]; then\n  uv pip install -e Server\nelif [\
        \ -f Server/requirements.txt ]; then\n  uv pip install -r Server/requirements.txt\n\
        else\n  echo \"No MCP Python deps found (skipping)\"\nfi\n"
    - name: Decide license sources
      id: lic
      shell: bash
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      run: 'set -eu

        use_ulf=false; use_ebl=false

        [[ -n "${UNITY_LICENSE:-}" ]] && use_ulf=true

        [[ -n "${UNITY_EMAIL:-}" && -n "${UNITY_PASSWORD:-}" && -n "${UNITY_SERIAL:-}"
        ]] && use_ebl=true

        echo "use_ulf=$use_ulf" >> "$GITHUB_OUTPUT"

        echo "use_ebl=$use_ebl" >> "$GITHUB_OUTPUT"

        echo "has_serial=$([[ -n "${UNITY_SERIAL:-}" ]] && echo true || echo false)"
        >> "$GITHUB_OUTPUT"

        '
    - name: Stage Unity .ulf license (from secret)
      if: steps.lic.outputs.use_ulf == 'true'
      id: ulf
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      shell: bash
      run: "set -eu\nmkdir -p \"$RUNNER_TEMP/unity-license-ulf\" \"$RUNNER_TEMP/unity-local/Unity\"\
        \nf=\"$RUNNER_TEMP/unity-license-ulf/Unity_lic.ulf\"\nif printf \"%s\" \"\
        $UNITY_LICENSE\" | base64 -d - >/dev/null 2>&1; then\n  printf \"%s\" \"$UNITY_LICENSE\"\
        \ | base64 -d - > \"$f\"\nelse\n  printf \"%s\" \"$UNITY_LICENSE\" > \"$f\"\
        \nfi\nchmod 600 \"$f\" || true\n# Detect ULF first; it is XML and includes\
        \ a <Signature> element.\nif grep -qi '<Signature>' \"$f\"; then\n  # provide\
        \ it in the standard local-share path too\n  cp -f \"$f\" \"$RUNNER_TEMP/unity-local/Unity/Unity_lic.ulf\"\
        \n  echo \"License source: ULF (Signature found)\"\n  echo \"ok=true\" >>\
        \ \"$GITHUB_OUTPUT\"\n# If someone pasted an entitlement XML into UNITY_LICENSE\
        \ by mistake, re-home it:\nelif grep -qi 'Entitlement|entitlement' \"$f\"\
        ; then\n  mkdir -p \"$RUNNER_TEMP/unity-config/Unity/licenses\"\n  mv \"$f\"\
        \ \"$RUNNER_TEMP/unity-config/Unity/licenses/UnityEntitlementLicense.xml\"\
        \n  echo \"License source: Entitlement XML (re-homed)\"\n  echo \"ok=false\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"License source: Unknown format (no\
        \ ULF Signature or Entitlement markers)\"\n  echo \"ok=false\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
    - name: Activate Unity (EBL via container - host-mount)
      if: steps.lic.outputs.use_ebl == 'true'
      shell: bash
      env:
        UNITY_IMAGE: ${{ env.UNITY_IMAGE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      run: "set -euo pipefail\n# host dirs to receive the full Unity config and local-share\n\
        mkdir -p \"$RUNNER_TEMP/unity-config\" \"$RUNNER_TEMP/unity-local\"\n\n# Try\
        \ Pro first if serial is present, otherwise named-user EBL.\ndocker run --rm\
        \ --network host \\\n  -e HOME=/root \\\n  -e UNITY_EMAIL -e UNITY_PASSWORD\
        \ -e UNITY_SERIAL \\\n  -v \"$RUNNER_TEMP/unity-config:/root/.config/unity3d\"\
        \ \\\n  -v \"$RUNNER_TEMP/unity-local:/root/.local/share/unity3d\" \\\n  \"\
        $UNITY_IMAGE\" bash -lc '\n    set -euxo pipefail\n    if [[ -n \"${UNITY_SERIAL:-}\"\
        \ ]]; then\n      /opt/unity/Editor/Unity -batchmode -nographics -logFile\
        \ - \\\n        -username \"$UNITY_EMAIL\" -password \"$UNITY_PASSWORD\" -serial\
        \ \"$UNITY_SERIAL\" -quit || true\n    else\n      /opt/unity/Editor/Unity\
        \ -batchmode -nographics -logFile - \\\n        -username \"$UNITY_EMAIL\"\
        \ -password \"$UNITY_PASSWORD\" -quit || true\n    fi\n    ls -la /root/.config/unity3d/Unity/licenses\
        \ || true\n  '\n\n# Verify entitlement written to host mount; allow ULF-only\
        \ runs to proceed\nif ! find \"$RUNNER_TEMP/unity-config\" -type f -iname\
        \ \"*.xml\" | grep -q .; then\n  if [[ \"${{ steps.ulf.outputs.ok }}\" ==\
        \ \"true\" ]]; then\n    echo \"EBL entitlement not found; proceeding with\
        \ ULF-only (ok=true).\"\n  else\n    echo \"No entitlement produced and no\
        \ valid ULF; cannot continue.\" >&2\n    exit 1\n  fi\nfi\n"
    - name: Warm up project (import Library once)
      if: steps.detect.outputs.anthropic_ok == 'true' && (steps.lic.outputs.use_ulf
        == 'true' || steps.lic.outputs.use_ebl == 'true')
      shell: bash
      env:
        UNITY_IMAGE: ${{ env.UNITY_IMAGE }}
        ULF_OK: ${{ steps.ulf.outputs.ok }}
      run: "set -euxo pipefail\nmanual_args=()\nif [[ \"${ULF_OK:-false}\" == \"true\"\
        \ ]]; then\n  manual_args=(-manualLicenseFile \"/root/.local/share/unity3d/Unity/Unity_lic.ulf\"\
        )\nfi\ndocker run --rm --network host \\\n  -e HOME=/root \\\n  -v \"${{ github.workspace\
        \ }}:${{ github.workspace }}\" -w \"${{ github.workspace }}\" \\\n  -v \"\
        $RUNNER_TEMP/unity-config:/root/.config/unity3d\" \\\n  -v \"$RUNNER_TEMP/unity-local:/root/.local/share/unity3d\"\
        \ \\\n  -v \"$RUNNER_TEMP/unity-cache:/root/.cache/unity3d\" \\\n  \"$UNITY_IMAGE\"\
        \ /opt/unity/Editor/Unity -batchmode -nographics -logFile - \\\n    -projectPath\
        \ \"${{ github.workspace }}/TestProjects/UnityMCPTests\" \\\n    \"${manual_args[@]}\"\
        \ \\\n    -quit\n"
    - name: Clean old MCP status
      run: 'set -eux

        mkdir -p "$GITHUB_WORKSPACE/.unity-mcp"

        rm -f "$GITHUB_WORKSPACE/.unity-mcp"/unity-mcp-status-*.json || true

        '
    - name: Start Unity (persistent bridge)
      if: steps.detect.outputs.anthropic_ok == 'true' && (steps.lic.outputs.use_ulf
        == 'true' || steps.lic.outputs.use_ebl == 'true')
      shell: bash
      env:
        UNITY_IMAGE: ${{ env.UNITY_IMAGE }}
        ULF_OK: ${{ steps.ulf.outputs.ok }}
      run: "set -euxo pipefail\nmanual_args=()\nif [[ \"${ULF_OK:-false}\" == \"true\"\
        \ ]]; then\n  manual_args=(-manualLicenseFile \"/root/.local/share/unity3d/Unity/Unity_lic.ulf\"\
        )\nfi\n\nmkdir -p \"$GITHUB_WORKSPACE/.unity-mcp\"\ndocker rm -f unity-mcp\
        \ >/dev/null 2>&1 || true\ndocker run -d --name unity-mcp --network host \\\
        \n  -e HOME=/root \\\n  -e UNITY_MCP_ALLOW_BATCH=1 \\\n  -e UNITY_MCP_STATUS_DIR=\"\
        ${{ github.workspace }}/.unity-mcp\" \\\n  -e UNITY_MCP_BIND_HOST=127.0.0.1\
        \ \\\n  -v \"${{ github.workspace }}:${{ github.workspace }}\" -w \"${{ github.workspace\
        \ }}\" \\\n  -v \"$RUNNER_TEMP/unity-config:/root/.config/unity3d\" \\\n \
        \ -v \"$RUNNER_TEMP/unity-local:/root/.local/share/unity3d\" \\\n  -v \"$RUNNER_TEMP/unity-cache:/root/.cache/unity3d\"\
        \ \\\n  \"$UNITY_IMAGE\" /opt/unity/Editor/Unity -batchmode -nographics -logFile\
        \ /root/.config/unity3d/Editor.log \\\n    -stackTraceLogType Full \\\n  \
        \  -projectPath \"${{ github.workspace }}/TestProjects/UnityMCPTests\" \\\n\
        \    \"${manual_args[@]}\" \\\n    -executeMethod MCPForUnity.Editor.McpCiBoot.StartStdioForCi\n"
    - name: Wait for Unity bridge (robust)
      if: steps.detect.outputs.anthropic_ok == 'true' && (steps.lic.outputs.use_ulf
        == 'true' || steps.lic.outputs.use_ebl == 'true')
      shell: bash
      run: "set -euo pipefail\ndeadline=$((SECONDS+600))          # 10 min max\nfatal_after=$((SECONDS+120))\
        \       # give licensing 2 min to settle\n\n# Fail fast only if container\
        \ actually died\nst=\"$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}'\
        \ unity-mcp 2>/dev/null || true)\"\ncase \"$st\" in exited*|dead*) docker\
        \ logs unity-mcp --tail 200 | sed -E 's/((email|serial|license|password|token)[^[:space:]]*)/[REDACTED]/Ig';\
        \ exit 1;; esac\n\n# Patterns\nok_pat='(Bridge|MCP(For)?Unity|AutoConnect).*(listening|ready|started|port|bound)'\n\
        # Only truly fatal signals; allow transient \"Licensing::...\" chatter\nlicense_fatal='No\
        \ valid Unity|License is not active|cannot load ULF|Signature element not\
        \ found|Token not found|0 entitlement|Entitlement.*(failed|denied)|License\
        \ (activation|return|renewal).*(failed|expired|denied)'\n\nwhile [ $SECONDS\
        \ -lt $deadline ]; do\n  logs=\"$(docker logs unity-mcp 2>&1 || true)\"\n\n\
        \  # 1) Primary: status JSON exposes TCP port\n  port=\"$(jq -r '.unity_port\
        \ // empty' \"$GITHUB_WORKSPACE\"/.unity-mcp/unity-mcp-status-*.json 2>/dev/null\
        \ | head -n1 || true)\"\n  if [[ -n \"${port:-}\" ]] && timeout 1 bash -lc\
        \ \"exec 3<>/dev/tcp/127.0.0.1/$port\"; then\n    echo \"Bridge ready on port\
        \ $port\"\n    # Ensure status file is readable by all (Claude container might\
        \ run as different user)\n    docker exec unity-mcp chmod -R a+rwx \"$GITHUB_WORKSPACE/.unity-mcp\"\
        \ || chmod -R a+rwx \"$GITHUB_WORKSPACE/.unity-mcp\" || true\n    exit 0\n\
        \  fi\n\n  # 2) Secondary: log markers\n  if echo \"$logs\" | grep -qiE \"\
        $ok_pat\"; then\n    echo \"Bridge ready (log markers)\"\n    docker exec\
        \ unity-mcp chmod -R a+rwx \"$GITHUB_WORKSPACE/.unity-mcp\" || chmod -R a+rwx\
        \ \"$GITHUB_WORKSPACE/.unity-mcp\" || true\n    exit 0\n  fi\n\n  # Only treat\
        \ license failures as fatal *after* warm-up\n  if [ $SECONDS -ge $fatal_after\
        \ ] && echo \"$logs\" | grep -qiE \"$license_fatal\"; then\n    echo \"::error::Fatal\
        \ licensing signal detected after warm-up\"\n    echo \"$logs\" | tail -n\
        \ 200 | sed -E 's/((email|serial|license|password|token)[^[:space:]]*)/[REDACTED]/Ig'\n\
        \    exit 1\n  fi\n\n  # If the container dies mid-wait, bail\n  st=\"$(docker\
        \ inspect -f '{{.State.Status}}' unity-mcp 2>/dev/null || true)\"\n  if [[\
        \ \"$st\" != \"running\" ]]; then\n    echo \"::error::Unity container exited\
        \ during wait\"; docker logs unity-mcp --tail 200 | sed -E 's/((email|serial|license|password|token)[^[:space:]]*)/[REDACTED]/Ig'\n\
        \    exit 1\n  fi\n\n  sleep 2\ndone\n\necho \"::error::Bridge not ready before\
        \ deadline\"\ndocker logs unity-mcp --tail 200 | sed -E 's/((email|serial|license|password|token)[^[:space:]]*)/[REDACTED]/Ig'\n\
        exit 1\n"
    - name: Debug Unity bridge status
      if: always() && (steps.lic.outputs.use_ulf == 'true' || steps.lic.outputs.use_ebl
        == 'true')
      shell: bash
      run: "set -euxo pipefail\necho \"--- Unity container state ---\"\ndocker inspect\
        \ -f '{{.State.Status}} {{.State.ExitCode}}' unity-mcp || true\necho \"---\
        \ Unity container logs (tail 200) ---\"\ndocker logs unity-mcp --tail 200\
        \ | sed -E 's/((email|serial|license|password|token)[^[:space:]]*)/[REDACTED]/Ig'\
        \ || true\necho \"--- Container status dir ---\"\ndocker exec unity-mcp ls\
        \ -la \"${{ github.workspace }}/.unity-mcp\" || true\necho \"--- Host status\
        \ dir ---\"\nls -la \"$GITHUB_WORKSPACE/.unity-mcp\" || true\necho \"--- Host\
        \ status file (first 120 lines) ---\"\njq -r . \"$GITHUB_WORKSPACE\"/.unity-mcp/unity-mcp-status-*.json\
        \ | sed -n '1,120p' || true\necho \"--- Port probe from host ---\"\nport=\"\
        $(jq -r '.unity_port // empty' \"$GITHUB_WORKSPACE\"/.unity-mcp/unity-mcp-status-*.json\
        \ 2>/dev/null | head -n1 || true)\"\necho \"unity_port=${port:-}\"\nif [[\
        \ -n \"${port:-}\" ]]; then\n  timeout 1 bash -lc \"exec 3<>/dev/tcp/127.0.0.1/$port\"\
        \ && echo \"TCP OK\" || echo \"TCP probe failed\"\nelse\n  echo \"No unity_port\
        \ in status file\"\nfi\necho \"--- Config dir listing ---\"\ndocker exec unity-mcp\
        \ ls -la /root/.config/unity3d || true\necho \"--- Editor log tail ---\"\n\
        docker exec unity-mcp tail -n 200 /root/.config/unity3d/Editor.log || true\n\
        # Fail fast if no status file was written\nshopt -s nullglob\nstatus_files=(\"\
        $GITHUB_WORKSPACE\"/.unity-mcp/unity-mcp-status-*.json)\nif ((${#status_files[@]}\
        \ == 0)); then\n  echo \"::error::No Unity MCP status file found; failing\
        \ fast.\"\n  exit 1\nfi\n"
    - name: Pin Claude tool permissions (.claude/settings.json)
      run: "set -eux\nmkdir -p .claude\ncat > .claude/settings.json <<'JSON'\n{\n\
        \  \"permissions\": {\n    \"allow\": [\n      \"mcp__unity\",\n      \"Edit(reports/**)\"\
        ,\n      \"MultiEdit(reports/**)\"\n    ],\n    \"deny\": [\n      \"Bash\"\
        ,\n      \"WebFetch\",\n      \"WebSearch\",\n      \"Task\",\n      \"TodoWrite\"\
        ,\n      \"NotebookEdit\",\n      \"NotebookRead\"\n    ]\n  }\n}\nJSON\n\n\
        # ---------- Reports & helper ----------\n"
    - name: Prepare reports and dirs
      run: 'set -eux

        rm -f reports/*.xml reports/*.md || true

        mkdir -p reports reports/_snapshots reports/_staging

        '
    - name: Create report skeletons
      run: "set -eu\ncat > \"$JUNIT_OUT\" <<'XML'\n<?xml version=\"1.0\" encoding=\"\
        UTF-8\"?>\n<testsuites><testsuite name=\"UnityMCP.NL-T\" tests=\"1\" failures=\"\
        1\" errors=\"0\" skipped=\"0\" time=\"0\">\n  <testcase name=\"NL-Suite.Bootstrap\"\
        \ classname=\"UnityMCP.NL-T\">\n    <failure message=\"bootstrap\">Bootstrap\
        \ placeholder; suite will append real tests.</failure>\n  </testcase>\n</testsuite></testsuites>\n\
        XML\nprintf '# Unity NL/T Editing Suite Test Results\\n\\n' > \"$MD_OUT\"\n"
    - name: Verify Unity bridge status/port
      run: "set -euxo pipefail\nls -la \"$GITHUB_WORKSPACE/.unity-mcp\" || true\n\
        jq -r . \"$GITHUB_WORKSPACE\"/.unity-mcp/unity-mcp-status-*.json | sed -n\
        \ '1,80p' || true\n\nshopt -s nullglob\nstatus_files=(\"$GITHUB_WORKSPACE\"\
        /.unity-mcp/unity-mcp-status-*.json)\nif ((${#status_files[@]})); then\n \
        \ port=\"$(grep -hEo '\"unity_port\"[[:space:]]*:[[:space:]]*[0-9]+' \"${status_files[@]}\"\
        \ \\\n    | sed -E 's/.*: *([0-9]+).*/\\1/' | head -n1 || true)\"\nelse\n\
        \  port=\"\"\nfi\n\necho \"unity_port=$port\"\nif [[ -n \"$port\" ]]; then\n\
        \  timeout 1 bash -lc \"exec 3<>/dev/tcp/127.0.0.1/$port\" && echo \"TCP OK\"\
        \nfi\n\nif ((${#status_files[@]})); then\n  first_status=\"${status_files[0]}\"\
        \n  fname=\"$(basename \"$first_status\")\"\n  hash_part=\"${fname%.json}\"\
        ; hash_part=\"${hash_part#unity-mcp-status-}\"\n  proj=\"$(jq -r '.project_name\
        \ // empty' \"$first_status\" || true)\"\n  if [[ -n \"${proj:-}\" && -n \"\
        ${hash_part:-}\" ]]; then\n    echo \"UNITY_MCP_DEFAULT_INSTANCE=${proj}@${hash_part}\"\
        \ >> \"$GITHUB_ENV\"\n    echo \"Default instance set to ${proj}@${hash_part}\"\
        \n  fi\nfi\n"
    - name: Write MCP config (.claude/mcp.json)
      run: "set -eux\nmkdir -p .claude\npython3 - <<'PY'\nimport json\nimport os\n\
        import textwrap\nfrom pathlib import Path\n\nworkspace = os.environ[\"GITHUB_WORKSPACE\"\
        ]\ndefault_inst = os.environ.get(\"UNITY_MCP_DEFAULT_INSTANCE\", \"\").strip()\n\
        \ncfg = {\n    \"mcpServers\": {\n        \"unity\": {\n            \"args\"\
        : [\n                \"run\",\n                \"--active\",\n           \
        \     \"--directory\",\n                \"Server\",\n                \"mcp-for-unity\"\
        ,\n                \"--transport\",\n                \"stdio\",\n        \
        \    ],\n            \"transport\": {\"type\": \"stdio\"},\n            \"\
        env\": {\n                \"PYTHONUNBUFFERED\": \"1\",\n                \"\
        MCP_LOG_LEVEL\": \"debug\",\n                \"UNITY_PROJECT_ROOT\": f\"{workspace}/TestProjects/UnityMCPTests\"\
        ,\n                \"UNITY_MCP_STATUS_DIR\": f\"{workspace}/.unity-mcp\",\n\
        \                \"UNITY_MCP_HOST\": \"127.0.0.1\",\n            },\n    \
        \    }\n    }\n}\n\nunity = cfg[\"mcpServers\"][\"unity\"]\nif default_inst:\n\
        \    unity[\"env\"][\"UNITY_MCP_DEFAULT_INSTANCE\"] = default_inst\n    if\
        \ \"--default-instance\" not in unity[\"args\"]:\n        unity[\"args\"]\
        \ += [\"--default-instance\", default_inst]\n\nrunner_script = Path(\".claude/run-unity-mcp.sh\"\
        )\nworkspace_path = Path(workspace)\nuv_candidate = workspace_path / \".venv\"\
        \ / \"bin\" / \"uv\"\nuv_cmd = uv_candidate.as_posix() if uv_candidate.exists()\
        \ else \"uv\"\nscript = textwrap.dedent(f\"\"\"\\\n    #!/usr/bin/env bash\n\
        \    set -euo pipefail\n    LOG=\"{workspace}/.unity-mcp/mcp-server-startup-debug.log\"\
        \n    mkdir -p \"$(dirname \"$LOG\")\"\n    echo \"\" >> \"$LOG\"\n    echo\
        \ \"[ $(date -Iseconds) ] Starting unity MCP server\" >> \"$LOG\"\n    # Redirect\
        \ stderr to log, keep stdout for MCP communication\n    exec {uv_cmd} \"$@\"\
        \ 2>> \"$LOG\"\n    \"\"\")\nrunner_script.write_text(script)\nrunner_script.chmod(0o755)\n\
        \nunity[\"command\"] = runner_script.resolve().as_posix()\n\npath = Path(\"\
        .claude/mcp.json\")\npath.write_text(json.dumps(cfg, indent=2) + \"\\n\")\n\
        print(f\"Wrote {path} and {runner_script} (UNITY_MCP_DEFAULT_INSTANCE={default_inst\
        \ or 'unset'})\")\nPY\n"
    - name: Debug MCP config
      run: 'set -eux

        echo "=== .claude/mcp.json ==="

        cat .claude/mcp.json

        echo ""

        echo "=== Status dir contents ==="

        ls -la "$GITHUB_WORKSPACE/.unity-mcp" || true

        echo ""

        echo "=== Status file content ==="

        cat "$GITHUB_WORKSPACE"/.unity-mcp/unity-mcp-status-*.json 2>/dev/null ||
        echo "(no status files)"

        '
    - name: Preflight MCP server (with retries)
      env:
        UNITY_MCP_DEFAULT_INSTANCE: ${{ env.UNITY_MCP_DEFAULT_INSTANCE }}
      run: "set -euxo pipefail\nexport PYTHONUNBUFFERED=1\nexport MCP_LOG_LEVEL=debug\n\
        export UNITY_PROJECT_ROOT=\"$GITHUB_WORKSPACE/TestProjects/UnityMCPTests\"\
        \nexport UNITY_MCP_STATUS_DIR=\"$GITHUB_WORKSPACE/.unity-mcp\"\nexport UNITY_MCP_HOST=127.0.0.1\n\
        if [[ -n \"${UNITY_MCP_DEFAULT_INSTANCE:-}\" ]]; then\n  export UNITY_MCP_DEFAULT_INSTANCE\n\
        fi\n\n# Debug: probe Unity's actual ping/pong response\necho \"--- Unity ping/pong\
        \ probe ---\"\npython3 <<'PY'\nimport socket, struct, sys\nport = 6400\ntry:\n\
        \    s = socket.create_connection((\"127.0.0.1\", port), timeout=2)\n    s.settimeout(2)\n\
        \    hs = s.recv(512)\n    print(f\"handshake: {hs!r}\")\n    hs_ok = b\"\
        FRAMING=1\" in hs\n    print(f\"FRAMING=1 present: {hs_ok}\")\n    if hs_ok:\n\
        \        s.sendall(struct.pack(\">Q\", 4) + b\"ping\")\n        hdr = s.recv(8)\n\
        \        print(f\"response header len: {len(hdr)}\")\n        if len(hdr)\
        \ == 8:\n            length = struct.unpack(\">Q\", hdr)[0]\n            resp\
        \ = s.recv(length)\n            print(f\"response payload: {resp!r}\")\n \
        \           pong_check = b'\"message\":\"pong\"'\n            print(f\"contains\
        \ pong_check: {pong_check in resp}\")\n    s.close()\nexcept Exception as\
        \ e:\n    print(f\"probe error: {e}\")\nPY\n\nattempt=0\nwhile true; do\n\
        \  attempt=$((attempt+1))\n  if uv run --active --directory Server mcp-for-unity\
        \ --transport stdio --help > /tmp/mcp-preflight.log 2>&1; then\n    cat /tmp/mcp-preflight.log\n\
        \    break\n  fi\n  if [ \"$attempt\" -ge 5 ]; then\n    echo \"::error::MCP\
        \ server did not settle after $attempt attempts\"\n    cat /tmp/mcp-preflight.log\
        \ || true\n    exit 1\n  fi\n  sleep 2\ndone\n"
    - name: Verify MCP Unity instance and Claude args
      env:
        UNITY_MCP_DEFAULT_INSTANCE: ${{ env.UNITY_MCP_DEFAULT_INSTANCE }}
